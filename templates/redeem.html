<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Niko">
    <title>兑换/查询 - Niko 虚拟卡</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/redeem.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="main-container">
        <!-- 左侧面板 - 输入区 -->
        <div class="left-panel">
            <div class="panel-header">
                <img src="/static/icon.png" alt="Logo" class="header-logo">
                <h1>Niko 虚拟卡</h1>
            </div>
            
            <div class="input-section">
                <textarea id="redeemKeyInput" placeholder="请输入卡密（每行一个，最多10个）..."></textarea>
                <p class="input-hint">支持批量兑换，每行输入一个卡密，每个间隔3秒处理</p>
                <button class="submit-btn" id="redeemBtn" onclick="redeemOrQuery()">兑换 / 查询</button>
                
                <div id="progressSection" class="progress-section" style="display: none;">
                    <div class="progress-info">
                        <div class="spinner"></div>
                        <span id="progressText" class="progress-text">正在处理...</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill" style="width: 0%"></div>
                    </div>
                    <div id="progressCount" class="progress-count">0 / 0</div>
                </div>
            </div>
            
            <div class="footer">
                NikoCard · v{{ version }}
            </div>
        </div>
        
        <!-- 右侧面板 - 结果区 -->
        <div class="right-panel">
            <!-- 卡片导航 -->
            <div id="cardNavigation" class="card-navigation" style="display: none;">
                <button class="nav-btn" id="prevBtn" onclick="showPrevCard()" disabled>←</button>
                <div class="card-indicator">
                    <span class="current" id="currentIndex">1</span>
                    <span class="divider">/</span>
                    <span class="total" id="totalCards">1</span>
                </div>
                <span id="cardStatusBadge" class="card-status-badge success">已兑换</span>
                <button class="nav-btn" id="nextBtn" onclick="showNextCard()" disabled>→</button>
            </div>
            
            <!-- 结果内容 -->
            <div id="resultContent" class="result-content">
                <!-- 空状态 -->
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">💳</div>
                    <div class="empty-text">输入卡密开始兑换</div>
                    <div class="empty-hint">兑换成功后卡片信息将显示在这里</div>
                </div>
                
                <!-- 维护状态 -->
                <div id="maintenanceState" class="empty-state" style="display: none;">
                    <div class="empty-icon">🔧</div>
                    <div class="empty-text" style="color: #f59e0b;">系统维护中</div>
                    <div class="empty-hint">服务暂时不可用，请稍后重试</div>
                </div>
                
                <!-- 错误状态 -->
                <div id="errorState" class="error-state" style="display: none;">
                    <div class="error-icon">❌</div>
                    <div id="errorMessage" class="error-message"></div>
                    <div id="errorKey" class="error-key"></div>
                </div>
                
                <!-- 上方：卡片信息 + 账单地址 -->
                <div id="topRowSection" class="top-row" style="display: none;">
                    <!-- 卡片信息 -->
                    <div id="cardInfoSection" class="info-card">
                        <div class="info-card-header">
                            <span class="info-card-title">卡片信息</span>
                            <button class="copy-btn" id="copyCardBtn">复制卡片信息</button>
                        </div>
                        <div class="info-grid-scroll">
                            <div class="info-grid" id="cardInfoGrid"></div>
                        </div>
                    </div>
                    
                    <!-- 账单地址 -->
                    <div id="addressSection" class="info-card">
                        <div class="info-card-header">
                            <span class="info-card-title">账单地址</span>
                            <button class="copy-btn" id="copyAddressBtn">复制完整地址</button>
                        </div>
                        <div class="info-grid-scroll">
                            <div class="info-grid" id="addressGrid"></div>
                        </div>
                    </div>
                </div>
                
                <!-- 下方：消费记录 -->
                <div id="transactionsSection" class="info-card full-height bottom-row" style="display: none;">
                    <div class="info-card-header">
                        <span class="info-card-title">消费记录</span>
                    </div>
                    <div class="transactions-placeholder">
                        <div class="placeholder-icon">📋</div>
                        <div class="placeholder-text">暂无消费记录</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- 公告弹窗 -->
    <div id="announcementPopup" class="announcement-popup" style="display: none;">
        <div class="announcement-header">
            <span class="announcement-title">📢 公告</span>
            <button class="announcement-close" onclick="closeAnnouncement()">&times;</button>
        </div>
        <div class="announcement-content" id="announcementText"></div>
        <div class="announcement-time" id="announcementTime"></div>
    </div>

    <style>
        .announcement-popup {
            position: fixed;
            top: 20px;
            right: 20px;
            max-width: 320px;
            background: rgba(30, 35, 50, 0.95);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .announcement-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .announcement-title {
            font-weight: 600;
            color: #fff;
            font-size: 14px;
        }
        .announcement-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .announcement-close:hover {
            color: #fff;
        }
        .announcement-content {
            padding: 16px;
            padding-bottom: 8px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
        }
        .announcement-content p { margin: 0 0 8px; }
        .announcement-content p:last-child { margin-bottom: 0; }
        .announcement-content h1 { margin: 0 0 8px; font-size: 20px; font-weight: bold; }
        .announcement-content h2 { margin: 0 0 8px; font-size: 17px; font-weight: bold; }
        .announcement-content h3 { margin: 0 0 8px; font-size: 15px; font-weight: bold; }
        .announcement-content ul, .announcement-content ol { margin: 0 0 8px; padding-left: 20px; }
        .announcement-content a { color: #6366f1; }
        .announcement-content code { background: rgba(99,102,241,0.2); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .announcement-content pre { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; overflow-x: auto; }
        .announcement-content blockquote { border-left: 3px solid #6366f1; margin: 0 0 8px; padding-left: 12px; color: rgba(255,255,255,0.6); }
        .announcement-time {
            padding: 0 16px 12px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            text-align: right;
        }
        @media (max-width: 768px) {
            .announcement-popup {
                top: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
            }
        }
    </style>

    <script>
        let allResults = [];
        let currentCardIndex = 0;

        function formatPan(pan) {
            if (!pan) return '****';
            return pan.replace(/(.{4})/g, '$1 ').trim();
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 倒计时定时器
        let countdownTimer = null;

        function startCountdown(usedTimeStr, expireMinutes) {
            // 清除之前的定时器
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }

            if (!usedTimeStr || !expireMinutes) return;

            const usedTime = new Date(usedTimeStr).getTime();
            const expireMs = expireMinutes * 60 * 1000;
            const expireTime = usedTime + expireMs;

            function updateCountdown() {
                const now = Date.now();
                const remainingMs = expireTime - now;
                const remainingEl = document.getElementById('remainingTime');
                
                if (!remainingEl) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    return;
                }

                if (remainingMs <= 0) {
                    remainingEl.textContent = '已过期';
                    remainingEl.classList.add('expired');
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    return;
                }

                const totalSeconds = Math.floor(remainingMs / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                
                if (minutes > 0) {
                    remainingEl.textContent = `${minutes}分${seconds.toString().padStart(2, '0')}秒`;
                } else {
                    remainingEl.textContent = `${seconds}秒`;
                }

                // 小于60秒时显示警告色
                if (totalSeconds < 60) {
                    remainingEl.classList.add('warning');
                } else {
                    remainingEl.classList.remove('warning');
                }
            }

            // 立即更新一次
            updateCountdown();
            // 每秒更新
            countdownTimer = setInterval(updateCountdown, 1000);
        }

        async function redeemOrQuery() {
            const input = document.getElementById('redeemKeyInput').value.trim();
            if (!input) {
                showToast('请输入卡密', 'error');
                return;
            }

            const allInputKeys = input.split('\n')
                .map(k => k.trim())
                .filter(k => k.length > 0);
            
            // 限制最多10个，并立即更新输入框
            const keys = allInputKeys.slice(0, 10);
            
            if (allInputKeys.length > 10) {
                // 立即修正输入框为前10个
                document.getElementById('redeemKeyInput').value = keys.join('\n');
                showToast(`已截取前10个卡密进行处理`, 'info');
            }

            if (keys.length === 0) {
                showToast('请输入有效的卡密', 'error');
                return;
            }

            allResults = [];
            currentCardIndex = 0;
            
            hideAllResults();
            document.getElementById('redeemBtn').disabled = true;

            if (keys.length === 1) {
                await processSingleKey(keys[0]);
            } else {
                await processBatchKeys(keys);
            }

            document.getElementById('redeemBtn').disabled = false;
        }

        function hideAllResults() {
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('errorState').style.display = 'none';
            document.getElementById('topRowSection').style.display = 'none';
            document.getElementById('transactionsSection').style.display = 'none';
            document.getElementById('cardNavigation').style.display = 'none';
        }

        async function processSingleKey(keyId) {
            showProgress(true);
            document.getElementById('progressText').textContent = '正在处理...';
            document.getElementById('progressCount').textContent = '';

            try {
                const result = await processOneKey(keyId, 1, 1);
                
                // 如果是维护状态，不显示结果
                if (result.maintenance) {
                    return;
                }
                
                allResults.push(result);
                showResults();
                
                if (result.success) {
                    showToast(result.isQuery ? '查询成功' : '兑换成功！', 'success');
                    // 成功就清空输入框
                    document.getElementById('redeemKeyInput').value = '';
                } else {
                    // 失败则保留在输入框
                    showToast(result.error || '处理失败', 'error');
                }
            } finally {
                if (!serviceAvailable) return;
                showProgress(false);
            }
        }

        async function processBatchKeys(keys) {
            const total = keys.length;
            let remainingKeys = [...keys]; // 跟踪剩余的卡密
            
            showProgress(true);
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressCount').textContent = `0 / ${total}`;

            let successCount = 0;
            let errorCount = 0;

            for (let i = 0; i < keys.length; i++) {
                const keyId = keys[i];
                const index = i + 1;
                
                document.getElementById('progressText').textContent = `正在处理第 ${index} 个卡密...`;
                
                const result = await processOneKey(keyId, index, total);
                
                // 如果是维护状态，停止处理
                if (result.maintenance) {
                    return;
                }
                
                allResults.push(result);
                
                if (result.success) {
                    successCount++;
                    // 成功（兑换或查询）后从剩余列表中移除
                    remainingKeys = remainingKeys.filter(k => k !== keyId);
                    // 实时更新输入框，只保留失败的卡密
                    document.getElementById('redeemKeyInput').value = remainingKeys.join('\n');
                } else {
                    errorCount++;
                    // 失败的保留在输入框，不做处理
                }
                
                // 实时显示结果：每处理完一个就展示
                showResultsRealtime(allResults.length - 1);
                
                const percent = ((i + 1) / total * 100).toFixed(0);
                document.getElementById('progressFill').style.width = percent + '%';
                document.getElementById('progressCount').textContent = `${i + 1} / ${total}`;
                
                // 只有新兑换才需要等待3秒，查询不需要等待
                if (i < keys.length - 1 && !result.isQuery) {
                    document.getElementById('progressText').textContent = `等待中...（3秒后处理下一个）`;
                    await sleep(3000);
                }
            }

            if (!serviceAvailable) return;
            showProgress(false);
            
            if (successCount > 0 && errorCount === 0) {
                showToast(`全部成功！共 ${successCount} 张卡`, 'success');
            } else if (successCount > 0) {
                showToast(`成功 ${successCount} 张，失败 ${errorCount} 张`, 'info');
            } else {
                showToast(`全部失败，共 ${errorCount} 个`, 'error');
            }
        }
        
        // 实时显示结果，每处理完一个卡密就更新右侧显示
        function showResultsRealtime(newIndex) {
            if (allResults.length === 0) return;
            
            // 显示导航
            document.getElementById('cardNavigation').style.display = 'flex';
            document.getElementById('totalCards').textContent = allResults.length;
            
            // 只有第一个结果时自动显示，后续不跳转，避免打断用户查看
            if (allResults.length === 1) {
                currentCardIndex = 0;
                showCard(currentCardIndex);
            } else {
                // 更新导航按钮状态（可能需要启用"下一个"按钮）
                document.getElementById('nextBtn').disabled = currentCardIndex === allResults.length - 1;
            }
        }

        function showProgress(show) {
            document.getElementById('progressSection').style.display = show ? 'block' : 'none';
        }

        async function processOneKey(keyId, index, total) {
            try {
                // 更新进度为查询中
                document.getElementById('progressText').textContent = total > 1 
                    ? `正在查询第 ${index} 个卡密...` 
                    : '正在查询...';
                
                const queryResponse = await fetch('/api/keys/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key_id: keyId })
                });
                const queryData = await queryResponse.json();

                if (queryData.success) {
                    return { success: true, isQuery: true, index, keyId, data: queryData };
                }
                
                if (queryData.error === '卡密未使用') {
                    // 更新进度为兑换中
                    document.getElementById('progressText').textContent = total > 1 
                        ? `正在兑换第 ${index} 个卡密...` 
                        : '正在兑换...';
                    
                    const redeemResponse = await fetch('/api/keys/redeem', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ key_id: keyId })
                    });
                    const redeemData = await redeemResponse.json();

                    if (redeemData.success) {
                        // 新兑换的卡片，设置兑换时间为当前时间
                        if (!redeemData.used_time) {
                            redeemData.used_time = new Date().toISOString();
                        }
                        return { success: true, isQuery: false, index, keyId, data: redeemData };
                    } else {
                        // 检查是否是维护状态
                        if (redeemData.maintenance) {
                            showMaintenanceMode();
                            return { success: false, index, keyId, error: redeemData.error || '兑换失败', maintenance: true };
                        }
                        return { success: false, index, keyId, error: redeemData.error || '兑换失败' };
                    }
                } else {
                    return { success: false, index, keyId, error: queryData.error || '查询失败' };
                }
            } catch (error) {
                return { success: false, index, keyId, error: '请求失败' };
            }
        }

        function showResults() {
            if (allResults.length === 0) {
                document.getElementById('emptyState').style.display = 'flex';
                return;
            }
            
            // 只要有结果就显示导航
            document.getElementById('cardNavigation').style.display = 'flex';
            document.getElementById('totalCards').textContent = allResults.length;
            
            showCard(currentCardIndex);
        }

        function showCard(index) {
            if (index < 0 || index >= allResults.length) return;
            
            currentCardIndex = index;
            const result = allResults[index];
            
            hideAllResults();
            
            if (allResults.length > 1) {
                document.getElementById('cardNavigation').style.display = 'flex';
            }
            
            if (result.success) {
                showCardResult(result.data, result.isQuery);
            } else {
                showErrorResult(result);
            }
            
            updateNavigation(result);
        }

        function updateNavigation(result) {
            document.getElementById('currentIndex').textContent = currentCardIndex + 1;
            document.getElementById('totalCards').textContent = allResults.length;
            document.getElementById('prevBtn').disabled = currentCardIndex === 0;
            document.getElementById('nextBtn').disabled = currentCardIndex === allResults.length - 1;
            
            const badge = document.getElementById('cardStatusBadge');
            if (result.success) {
                badge.textContent = result.isQuery ? '已查询' : '已兑换';
                badge.className = 'card-status-badge ' + (result.isQuery ? 'query' : 'success');
            } else {
                badge.textContent = '失败';
                badge.className = 'card-status-badge error';
            }
        }

        function showPrevCard() {
            if (currentCardIndex > 0) showCard(currentCardIndex - 1);
        }

        function showNextCard() {
            if (currentCardIndex < allResults.length - 1) showCard(currentCardIndex + 1);
        }

        function generateRandomUSName() {
            const firstNames = ['James', 'John', 'Robert', 'Michael', 'William', 'David', 'Richard', 'Joseph', 'Thomas', 'Christopher', 'Mary', 'Patricia', 'Jennifer', 'Linda', 'Elizabeth', 'Barbara', 'Susan', 'Jessica', 'Sarah', 'Karen', 'Daniel', 'Matthew', 'Anthony', 'Mark', 'Donald', 'Steven', 'Paul', 'Andrew', 'Joshua', 'Kenneth', 'Nancy', 'Betty', 'Margaret', 'Sandra', 'Ashley', 'Dorothy', 'Kimberly', 'Emily', 'Donna', 'Michelle'];
            const lastNames = ['Smith', 'Johnson', 'Williams', 'Brown', 'Jones', 'Garcia', 'Miller', 'Davis', 'Rodriguez', 'Martinez', 'Hernandez', 'Lopez', 'Gonzalez', 'Wilson', 'Anderson', 'Thomas', 'Taylor', 'Moore', 'Jackson', 'Martin', 'Lee', 'Perez', 'Thompson', 'White', 'Harris', 'Sanchez', 'Clark', 'Ramirez', 'Lewis', 'Robinson', 'Walker', 'Young', 'Allen', 'King', 'Wright', 'Scott', 'Torres', 'Nguyen', 'Hill', 'Flores'];
            const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
            const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
            return `${firstName} ${lastName}`;
        }

        function formatAddress(addr) {
            if (!addr) return '';
            const parts = [];
            let street = (addr.address1 || '');
            if (addr.address2) street += ' ' + addr.address2;
            if (street.trim()) parts.push(street.trim());
            if (addr.city) parts.push(addr.city);
            let stateZip = '';
            if (addr.region) stateZip = addr.region;
            if (addr.postal_code) stateZip += (stateZip ? ' ' : '') + addr.postal_code;
            if (stateZip) parts.push(stateZip);
            if (addr.country) parts.push(addr.country);
            return parts.join(', ') || '';
        }

        function showCardResult(data, isQuery) {
            const card = data.card;
            const expShort = `${card.exp_month} ${String(card.exp_year).slice(-2)}`;
            const fullInfo = `${card.pan} ${expShort} ${card.cvv}`;
            const cardLimit = data.card_limit ?? card.card_limit ?? 0;
            // 如果没有 used_time，使用当前时间（新兑换的情况）
            const usedTimeValue = data.used_time || new Date().toISOString();
            const usedTimeDisplay = new Date(usedTimeValue).toLocaleString();
            const addr = data.legal_address || {};
            const fullAddress = formatAddress(addr);
            
            // 卡片信息
            const cardGrid = document.getElementById('cardInfoGrid');
            cardGrid.innerHTML = `
                <div class="info-item clickable" onclick="copyText('${card.pan}')">
                    <span class="info-label">卡号</span>
                    <span class="info-value mono large">${formatPan(card.pan)}</span>
                </div>
                <div class="info-item clickable" onclick="copyText('${card.cvv}')">
                    <span class="info-label">CVV</span>
                    <span class="info-value mono">${card.cvv}</span>
                </div>
                <div class="info-item clickable" onclick="copyText('${card.exp_month}/${card.exp_year}')">
                    <span class="info-label">有效期</span>
                    <span class="info-value mono">${card.exp_month}/${card.exp_year}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">剩余时间</span>
                    <span class="info-value countdown" id="remainingTime">计算中...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">余额</span>
                    <span class="info-value highlight">$${cardLimit}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">兑换时间</span>
                    <span class="info-value">${usedTimeDisplay}</span>
                </div>
            `;
            
            // 启动倒计时
            startCountdown(usedTimeValue, data.expire_minutes);
            
            document.getElementById('copyCardBtn').onclick = () => copyText(fullInfo);
            
            // 账单地址
            const street = ((addr.address1 || '') + (addr.address2 ? ' ' + addr.address2 : '')).trim();
            const randomName = generateRandomUSName();
            const addressGrid = document.getElementById('addressGrid');
            addressGrid.innerHTML = `
                <div class="info-item clickable" onclick="copyText('${randomName.replace(/'/g, "\\'")}')">
                    <span class="info-label">全名</span>
                    <span class="info-value">${randomName}</span>
                </div>
                <div class="info-item clickable" onclick="copyText('${street.replace(/'/g, "\\'")}')">
                    <span class="info-label">街道</span>
                    <span class="info-value">${street || '-'}</span>
                </div>
                <div class="info-item clickable" onclick="copyText('${(addr.city || '').replace(/'/g, "\\'")}')">
                    <span class="info-label">城市</span>
                    <span class="info-value">${addr.city || '-'}</span>
                </div>
                <div class="info-item clickable" onclick="copyText('${(addr.region || '').replace(/'/g, "\\'")}')">
                    <span class="info-label">州/省</span>
                    <span class="info-value">${addr.region || '-'}</span>
                </div>
                <div class="info-item clickable" onclick="copyText('${(addr.postal_code || '').replace(/'/g, "\\'")}')">
                    <span class="info-label">邮编</span>
                    <span class="info-value mono">${addr.postal_code || '-'}</span>
                </div>
                <div class="info-item clickable" onclick="copyText('${(addr.country || '').replace(/'/g, "\\'")}')">
                    <span class="info-label">国家</span>
                    <span class="info-value">${addr.country || '-'}</span>
                </div>
            `;
            
            document.getElementById('copyAddressBtn').onclick = () => copyText(fullAddress);
            
            // 显示上方区域和下方消费记录
            document.getElementById('topRowSection').style.display = 'flex';
            document.getElementById('transactionsSection').style.display = 'flex';
        }

        function showErrorResult(result) {
            document.getElementById('errorMessage').textContent = result.error;
            document.getElementById('errorKey').textContent = `卡密: ${result.keyId}`;
            document.getElementById('errorState').style.display = 'flex';
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    return Promise.resolve();
                } catch (e) {
                    document.body.removeChild(textarea);
                    return Promise.reject(e);
                }
            }
        }

        function copyText(text) {
            copyToClipboard(text).then(() => {
                showToast('已复制', 'success');
            }).catch(() => {
                showToast('复制失败', 'error');
            });
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // 键盘导航
        document.addEventListener('keydown', function(e) {
            if (allResults.length > 1 && document.getElementById('cardNavigation').style.display !== 'none') {
                if (e.key === 'ArrowLeft') showPrevCard();
                else if (e.key === 'ArrowRight') showNextCard();
            }
        });
        
        // 检查服务是否可用
        let serviceAvailable = true;
        
        async function checkServiceStatus() {
            try {
                const response = await fetch('/api/service/status');
                const data = await response.json();
                serviceAvailable = data.available;
                
                if (!serviceAvailable) {
                    showMaintenanceMode();
                }
            } catch (e) {
                console.error('Failed to check service status:', e);
            }
        }
        
        function showMaintenanceMode() {
            // 隐藏所有其他状态
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('errorState').style.display = 'none';
            document.getElementById('topRowSection').style.display = 'none';
            document.getElementById('transactionsSection').style.display = 'none';
            document.getElementById('cardNavigation').style.display = 'none';
            document.getElementById('progressSection').style.display = 'none';
            // 显示维护状态
            document.getElementById('maintenanceState').style.display = 'flex';
            document.getElementById('redeemBtn').disabled = true;
            document.getElementById('redeemBtn').textContent = '服务维护中';
            document.getElementById('redeemKeyInput').disabled = true;
            document.getElementById('redeemKeyInput').placeholder = '服务维护中，请稍后重试...';
            serviceAvailable = false;
        }
        
        // 页面加载时检查服务状态
        checkServiceStatus();
        
        // 加载公告
        async function loadAnnouncement() {
            try {
                const response = await fetch('/api/announcement');
                const data = await response.json();
                if (data.success && data.content && data.content.trim()) {
                    document.getElementById('announcementText').innerHTML = marked.parse(data.content, { breaks: true });
                    if (data.time) {
                        document.getElementById('announcementTime').textContent = '发布于 ' + data.time;
                    }
                    document.getElementById('announcementPopup').style.display = 'block';
                }
            } catch (e) {
                console.error('Failed to load announcement:', e);
            }
        }
        
        function closeAnnouncement() {
            document.getElementById('announcementPopup').style.display = 'none';
        }
        
        loadAnnouncement();
        
        // 注册 Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js')
                .catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
